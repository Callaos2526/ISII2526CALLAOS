# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
#  push:
#    branches: [ "development" ]
  pull_request:
    branches: 
      - development
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      API: ./src/AppForSEII2526.API/AppForSEII2526.API.csproj
      WEB: ./src/AppForSEII2526.WEB/AppForSEII2526.Web.csproj
      UT: ./src/AppForSEII2526.UT/AppForSEII2526.UT.csproj
      UIT: ./src/AppForSEII2526.UIT/AppForSEII2526.UIT.csproj


    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
    
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'
    - name: Restore dependencies
      run: |
        dotnet build ${{ env.API }}
        dotnet build ${{ env.WEB }}
        dotnet build ${{ env.UT }} 
        dotnet build ${{ env.UIT }}
        
    - name: Build the solution
      run: |
        dotnet build ${{ env.API }} --configuration Realease --no--restore
        dotnet build ${{ env.WEB }} --configuration Realease --no--restore
        dotnet build ${{ env.UT }} --configuration Realease --no--restore
        dotnet build ${{ env.UIT }} --configuration Realease --no--restore
     
    - name: Run unit tests with report
      run: dotnet test ${{ env.UT }} --configuration Realease --no-build --logger "trx;LogFileName=TestResults.trx"

    - name: Upload test results
      uses: actions/upload-artifict@v4
      with:
        name: TestResults
        path: ./test/AppForSEII2525.UT/TestResults/TestResults.trx
